<!DOCTYPE html>
<html>
<head>

	<meta name="viewport" content="width=device-width, initial-scale=1" charset="utf-8">
	<link rel="stylesheet" href="include/bootstrap.min.css">
	<script src="include/bootstrap.min.js"></script>
	<link rel="stylesheet" href="styles/default.css">
	<title>Paolo Notaro</title>
</head>
<body>
	<nav class="navbar navbar-dark navbar-expand-md bg-dark">
		<a class="navbar-brand" href=""> Paolo Notaro </a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle Navigation bar">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarContent">
			<ul class="navbar-nav mr-auto">
				<li class="nav-item active" href="pages/about.html">
					<a class="nav-link" >About me</a>
				</li>
				<li class="nav-item" href="pages/projects.html">
					<a class="nav-link">Projects</a>
				</li>
				<li class="nav-item" href="pages/contacts.html">
					<a class="nav-link" >Contacts</a>
				</li>
			</ul>
		</div>
	</nav>
	<script src="include/jquery-3.4.1.min.js"></script>
	<div class="main-content"></div>
</body>
<script type="text/javascript">

  loadViewportContent("pages/main.html");
  var ANIMATION_SPEED = 300;
  $('.nav-item').click(function(e){
  	e.preventDefault();
  	$('.nav-item').removeClass('active');
	$(this).addClass('active');
  	var url = $(this).attr('href');
  	$('.main-content').animate({opacity: '0'}, ANIMATION_SPEED, function(){
  		loadViewportContent(url);
  	});
  });

  function loadViewportContent(url){
	  $.get(url, success, "text");
	}

  function success(response){ 
   	$('.main-content').html(response.toString());
   	$('.main-content').animate({opacity: '1'}, ANIMATION_SPEED);
  }
</script>
</html>
